<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes sbFlow { 0% { transform: translate3d(0,-120%,0); opacity: 0 } 12% { opacity: 1 } 88% { opacity: 1 } 100% { transform: translate3d(0,120%,0); opacity: 0 } }
@keyframes sbBlink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
</style>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;height:{{ trackHeight }};font-family:'Titillium Web',system-ui,sans-serif">
  <div ref="{{ stageRef }}" style="position:sticky;top:{{ headerOffset }}px;height:calc(100vh - {{ headerOffset }}px);min-height:420px;contain:paint;isolation:isolate;overflow:hidden;background:var(--bg,#07070A);perspective:1600px">

    <div ref="{{ skyRef }}" style="position:absolute;inset:0;background:linear-gradient(185deg,#0B1020 0%,#0A0C15 38%,#07070A 72%);opacity:0;will-change:opacity;pointer-events:none"></div>
    <div ref="{{ sunRef }}" style="position:absolute;right:4%;top:4%;width:min(46vw,620px);height:min(46vw,620px);border-radius:50%;background:radial-gradient(circle,rgba(255,248,222,.92) 0%,rgba(255,226,120,.55) 12%,rgba(255,202,5,.28) 30%,rgba(249,165,26,.12) 52%,rgba(243,121,32,0) 74%);opacity:0;transform:translate3d(6%,44%,0) scale(.72);will-change:opacity,transform;pointer-events:none"></div>
    <div ref="{{ rayRef }}" style="position:absolute;right:-20%;top:-20%;width:140vw;height:140vh;background:conic-gradient(from 168deg at 78% 14%,rgba(255,220,130,0) 0deg,rgba(255,214,110,.13) 7deg,rgba(255,220,130,0) 15deg,rgba(255,214,110,.09) 24deg,rgba(255,220,130,0) 33deg,rgba(255,214,110,.12) 44deg,rgba(255,220,130,0) 54deg);opacity:0;will-change:opacity;pointer-events:none;mix-blend-mode:screen"></div>
    <div style="position:absolute;left:0;right:0;top:0;height:52%;background:linear-gradient(180deg,var(--bg,#07070A) 0%,var(--b-92,rgba(7,7,10,.92)) 42%,var(--b-0,rgba(7,7,10,0)) 100%);z-index:2;pointer-events:none"></div>

    <div ref="{{ worldRef }}" style="position:absolute;left:50%;top:50%;width:min(1340px,96vw,150vh);height:0;transform:translate3d(-50%,0,0);transform-style:preserve-3d;will-change:transform">
      <div ref="{{ planeRef }}" style="position:absolute;left:0;top:0;width:100%;aspect-ratio:2/1;transform:translateY(-50%) rotateX(70deg) scale(1.2);transform-origin:50% 50%;transform-style:preserve-3d;will-change:transform">

        <div ref="{{ roofRef }}" style="position:absolute;inset:0;border-radius:4px;opacity:0;transform:translate3d(0,70px,0);will-change:opacity,transform;overflow:hidden;background:linear-gradient(178deg,#33373C,#23262B 46%,#1A1D21);box-shadow:0 80px 150px -50px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.05)">
          <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.075) 0 1px,rgba(255,255,255,.025) 1px 3px,rgba(0,0,0,.26) 3px 5px,rgba(0,0,0,0) 5px 42px)"></div>
          <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,rgba(255,255,255,.03) 2px 3px,rgba(0,0,0,0) 3px 118px)"></div>
          <div style="position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 72% 8%,rgba(255,236,190,.10),rgba(0,0,0,0) 62%),radial-gradient(ellipse 90% 80% at 20% 95%,rgba(0,0,0,.42),rgba(0,0,0,0) 70%)"></div>
          <div style="position:absolute;left:2.5%;right:2.5%;top:4%;bottom:4%;border:1px solid rgba(255,255,255,.055);border-radius:3px"></div>
        </div>

        <div style="position:absolute;left:6%;right:6%;top:11%;bottom:11%;display:flex;flex-direction:column;justify-content:space-between;transform-style:preserve-3d">
          <sc-for list="{{ rails }}" as="r" hint-placeholder-count="4">
            <div style="position:relative;height:22.5%;transform-style:preserve-3d">
              <span ref="{{ r.railA }}" style="position:absolute;left:0;right:0;top:10%;height:4px;border-radius:2px;background:linear-gradient(180deg,#D3D7DC,#9BA0A7 45%,#70757C);box-shadow:0 2px 5px rgba(0,0,0,.6);opacity:0;transform:translate3d(-50px,0,0);will-change:opacity,transform"></span>
              <span ref="{{ r.railB }}" style="position:absolute;left:0;right:0;bottom:10%;height:4px;border-radius:2px;background:linear-gradient(180deg,#D3D7DC,#9BA0A7 45%,#70757C);box-shadow:0 2px 5px rgba(0,0,0,.6);opacity:0;transform:translate3d(50px,0,0);will-change:opacity,transform"></span>
              <span style="position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 1.5%">
                <sc-for list="{{ r.posts }}" as="p" hint-placeholder-count="9">
                  <span ref="{{ p.ref }}" style="width:7px;height:100%;border-radius:1px;background:linear-gradient(90deg,#8A8F96,#C6CAD0 40%,#5F646B);box-shadow:0 4px 10px -2px rgba(0,0,0,.7);opacity:0;transform:scaleY(0);transform-origin:bottom;will-change:opacity,transform"></span>
                </sc-for>
              </span>
              <span style="position:absolute;left:0;right:0;top:-18%;bottom:-18%;display:flex;gap:1.1%;transform-style:preserve-3d">
                <sc-for list="{{ r.panels }}" as="m" hint-placeholder-count="8">
                  <span ref="{{ m.ref }}" style="position:relative;flex:1;border-radius:3px;padding:3px;background:linear-gradient(152deg,#E3E7EC 0%,#A9AFB7 28%,#7C8189 54%,#C3C8CF 78%,#6B7077 100%);box-shadow:0 14px 26px -12px rgba(0,0,0,.85);opacity:0;transform:translate3d(0,-90px,80px) rotateX(-22deg);will-change:opacity,transform,box-shadow;overflow:hidden">
                    <span style="position:absolute;inset:0;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.5);pointer-events:none;z-index:4"></span>
                    <span style="position:absolute;inset:3px;border-radius:1px;overflow:hidden;background:radial-gradient(130% 150% at 26% -10%,#1E3A5F 0%,#152B49 34%,#0D1D33 64%,#081326 100%)">
                      <span style="position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(214,228,246,.22) 0 .7px,rgba(0,0,0,0) .7px 4.16%),repeating-linear-gradient(90deg,rgba(4,10,20,.85) 0 1.3px,rgba(0,0,0,0) 1.3px 8.33%),repeating-linear-gradient(0deg,rgba(4,10,20,.8) 0 1.3px,rgba(0,0,0,0) 1.3px 16.66%),linear-gradient(0deg,rgba(0,0,0,0) 48.6%,rgba(4,10,20,.9) 48.6% 51.4%,rgba(0,0,0,0) 51.4%)"></span>
                      <span style="position:absolute;inset:0;background-image:radial-gradient(circle at 0 0,rgba(0,0,0,.55) 0 22%,rgba(0,0,0,0) 34%);background-size:8.33% 16.66%;opacity:.75"></span>
                      <span ref="{{ m.glass }}" style="position:absolute;inset:0;background:linear-gradient(196deg,rgba(168,204,255,.20) 0%,rgba(120,160,215,.07) 26%,rgba(255,255,255,.015) 52%,rgba(0,0,0,.12) 100%);opacity:.85;will-change:opacity"></span>
                      <span ref="{{ m.sheen }}" style="position:absolute;top:-40%;bottom:-40%;left:0;width:240%;background:linear-gradient(104deg,rgba(255,255,255,0) 34%,rgba(255,246,214,.5) 44%,rgba(255,214,120,.78) 50%,rgba(255,246,214,.42) 56%,rgba(255,255,255,0) 66%);opacity:0;transform:translate3d(-70%,0,0);will-change:opacity,transform"></span>
                    </span>
                  </span>
                </sc-for>
              </span>
            </div>
          </sc-for>
        </div>

        <div ref="{{ bosRef }}" style="position:absolute;left:1.5%;top:38%;width:5.4%;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translate3d(-24px,0,0);will-change:opacity,transform">
          <span style="width:100%;aspect-ratio:3/4;border-radius:3px;background:linear-gradient(160deg,#4A4E55,#2B2E34 60%,#20232833);box-shadow:0 10px 22px -8px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.18);position:relative;overflow:hidden">
            <span style="position:absolute;left:14%;right:14%;top:16%;height:34%;border-radius:2px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 2px,rgba(255,255,255,.05) 2px 5px)"></span>
            <span ref="{{ ledRef }}" style="position:absolute;left:18%;bottom:16%;width:22%;aspect-ratio:1;border-radius:50%;background:#5FBF8B;box-shadow:0 0 8px rgba(95,191,139,.9);opacity:0;animation:sbBlink 1.6s ease-in-out infinite"></span>
          </span>
        </div>
        <div ref="{{ conduitRef }}" style="position:absolute;left:6.6%;top:14%;width:6px;height:64%;border-radius:3px;background:linear-gradient(90deg,#5C6168,#9DA2A9 45%,#4E5359);overflow:hidden;opacity:0;will-change:opacity">
          <sc-for list="{{ pulses }}" as="u" hint-placeholder-count="3">
            <span style="position:absolute;left:-1px;right:-1px;height:26%;border-radius:3px;background:linear-gradient(180deg,rgba(255,202,5,0),#FFE27A 50%,rgba(255,202,5,0));animation:sbFlow 1.5s linear infinite;animation-delay:{{ u.delay }}"></span>
          </sc-for>
        </div>
      </div>
      <div ref="{{ shadowRef }}" style="position:absolute;left:50%;top:0;width:112%;height:130px;transform:translate(-50%,-40%);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.7),rgba(0,0,0,0) 70%);opacity:0;will-change:opacity"></div>
    </div>

    <div ref="{{ companyRef }}" style="position:absolute;left:50%;top:44%;z-index:3;transform:translate3d(-50%,14px,0);opacity:0;display:flex;align-items:center;gap:13px;padding:13px 18px;border:1px solid var(--w-12,rgba(255,255,255,.12));border-radius:14px;background:var(--b-92,rgba(7,7,10,.92));white-space:nowrap;will-change:opacity,transform;backdrop-filter:blur(8px)">
      <span style="width:9px;height:9px;border-radius:2px;background:#FFCA05;flex:none"></span>
      <span style="display:flex;flex-direction:column;line-height:1.3;text-align:left">
        <span style="font-size:15px;font-weight:600;color:var(--fg,#F2F0EC)">Textiles del Aburrá S.A.S.</span>
        <span style="font-size:12.5px;color:var(--mut3,#7C7873)">Itagüí · Manufactura · cubierta 4.200 m² · datos demo</span>
      </span>
    </div>

    <div ref="{{ chipsRef }}" style="position:absolute;left:50%;top:41%;z-index:3;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;will-change:opacity;max-width:min(760px,90vw)">
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
          <span ref="{{ c.ref }}" style="display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--w-10,rgba(255,255,255,.1));border-radius:99px;background:var(--w-03,rgba(255,255,255,.03));font-size:14px;color:var(--mut3,#7C7873);transition:color 300ms ease,border-color 300ms ease,background 300ms ease,transform 300ms cubic-bezier(.22,.61,.36,1);will-change:transform">
            <span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8"></span>{{ c.label }}
          </span>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mut2,#8E8B86)">
        <span style="width:160px;height:3px;border-radius:99px;background:var(--w-10,rgba(255,255,255,.1));overflow:hidden"><span ref="{{ qualityRef }}" style="display:block;height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#FFCA05,#F37920);will-change:width"></span></span>
        <span ref="{{ qualityLabelRef }}">Calidad del referido</span>
      </div>
    </div>

    <div style="position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;padding:clamp(24px,4.5vh,52px) 24px 0;pointer-events:none;z-index:3">
      <sc-for list="{{ captions }}" as="c" hint-placeholder-count="7">
        <div ref="{{ c.ref }}" style="position:absolute;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;max-width:min(760px,86vw);padding:6px 22px 26px;opacity:0;transform:translate3d(0,14px,0);will-change:opacity,transform;background:radial-gradient(ellipse 78% 62% at 50% 44%,var(--b-84,rgba(7,7,10,.84)) 0%,var(--b-55,rgba(7,7,10,.55)) 52%,var(--b-0,rgba(7,7,10,0)) 100%)">
          <span style="display:inline-flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid rgba(255,202,5,.3);border-radius:99px;background:rgba(255,202,5,.08);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--y,#FFCA05)"><span style="font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold,#8E7A45)">{{ c.kicker }}</span><span>{{ c.step }}</span></span>
          <h3 style="margin:0;font-size:clamp(25px,3.6vw,46px);line-height:1.06;font-weight:700;letter-spacing:-.032em;color:var(--fg,#F2F0EC);text-wrap:pretty;text-shadow:0 2px 20px var(--b-92,rgba(7,7,10,.92)),0 1px 4px var(--b-72,rgba(7,7,10,.72))">{{ c.title }}</h3>
          <p style="margin:0;font-size:clamp(14px,1.2vw,17px);line-height:1.5;color:var(--t3,#B4B0A9);max-width:50ch;text-wrap:pretty;text-shadow:0 1px 14px var(--b-92,rgba(7,7,10,.92))">{{ c.body }}</p>
        </div>
      </sc-for>
    </div>

    <div ref="{{ meterRef }}" style="position:absolute;right:clamp(14px,3vw,40px);bottom:clamp(18px,4vh,40px);z-index:3;display:flex;flex-direction:column;gap:10px;padding:14px 18px;border:1px solid rgba(255,202,5,.22);border-radius:14px;background:var(--b-72,rgba(7,7,10,.72));backdrop-filter:blur(8px);opacity:0;transform:translate3d(18px,0,0);will-change:opacity,transform;min-width:172px">
      <span style="font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold,#8E7A45)">Generando</span>
      <span style="display:flex;align-items:baseline;gap:6px"><b ref="{{ kwpRef }}" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--fg,#F2F0EC)">0</b><span style="font-size:13px;color:var(--mut3,#7C7873)">kWp instalados</span></span>
      <span style="height:3px;border-radius:99px;background:var(--w-10,rgba(255,255,255,.1));overflow:hidden"><span ref="{{ genBarRef }}" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,#FFCA05,#F37920);will-change:width"></span></span>
      <span ref="{{ kwhRef }}" style="font-size:12.5px;color:var(--mut2,#8E8B86)">0 kWh/mes · demo</span>
    </div>

    <div ref="{{ ctaRef }}" style="position:absolute;left:50%;bottom:11%;z-index:3;transform:translate3d(-50%,16px,0);opacity:0;display:flex;flex-direction:column;align-items:center;gap:14px;will-change:opacity,transform;pointer-events:none">
      <button onClick="{{ onRefer }}" style="padding:16px 30px;border:none;border-radius:12px;background:linear-gradient(135deg,#FFCA05,#F37920);color:#1A1200;font-size:16.5px;font-weight:700;cursor:pointer;box-shadow:0 18px 40px -16px rgba(243,121,32,.85);transition:transform 180ms ease;pointer-events:auto" style-hover="transform:translateY(-2px)">Referir empresa</button>
      <span style="font-size:12.5px;color:var(--mut3,#7C7873)">Sin crear cuenta · dos minutos</span>
    </div>

    <div ref="{{ railRef }}" style="position:absolute;left:clamp(14px,3vw,40px);bottom:clamp(18px,4vh,40px);display:flex;flex-direction:column;gap:9px;max-width:270px;padding:14px 16px;border-radius:12px;background:var(--b-72,rgba(7,7,10,.72));backdrop-filter:blur(8px);z-index:3">
      <span style="font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mut4,#6B6762)">Cómo referir</span>
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
        <span ref="{{ s.ref }}" style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t3,#B4B0A9);opacity:.62;transition:color 260ms ease,opacity 260ms ease">
          <span ref="{{ s.dot }}" style="width:18px;height:3px;border-radius:2px;background:var(--w-12,rgba(255,255,255,.12));transition:background 300ms ease,box-shadow 300ms ease;flex:none"></span>
          <span><b style="font-weight:700;margin-right:6px">{{ s.n }}</b>{{ s.t }}</span>
        </span>
      </sc-for>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;onRefer&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;headerOffset&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:72,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:140,&quot;unit&quot;:&quot;px&quot;}}">
/* SolarBuildSequence v2 — planta fotovoltaica de 32 módulos que se construye con el scroll.
   Cámara que se levanta (70°→44°) y abre plano, módulos monocristalinos con celdas,
   busbars, marco de aluminio y reflejo especular que sigue al sol; inversor, conduit
   y pulsos de energía al cerrar. Recorrido corto (200vh) para que la transición sea rápida.
   Pintado por polling (32 ms) con compuertas de cambio; respeta prefers-reduced-motion. */
/* Dos relojes distintos: el texto avanza más lento que la construcción.
   Cada escena tiene una permanencia mínima de ~0.12 del recorrido (≈30vh) para
   que el paso a paso se pueda leer, mientras los tramos de animación son cortos. */
const SCENES = [
  { at: 0.00, step: 0, kicker: 'Paso 1', title: 'Todo comienza identificando una buena oportunidad.', body: 'Una empresa con una factura de energía alta y una cubierta o un lote disponible.' },
  { at: 0.105, step: 1, kicker: 'Paso 2', title: 'Comparte la información que tengas.', body: 'Entre más completa, mejor podemos evaluar la oportunidad. Empresa, contacto, ubicación, consumo y factura.' },
  { at: 0.245, step: 2, kicker: 'Paso 3', title: 'Con consumo y factura, GEENERA estructura la solución.', body: 'Ingeniería y análisis energético definen soportes, perfiles y rieles sobre la cubierta real.' },
  { at: 0.365, step: 3, kicker: 'Paso 4', title: 'GEENERA construye el sistema a la medida.', body: 'Módulo a módulo, una planta dimensionada al consumo y a la operación de la empresa.' },
  { at: 0.525, step: 3, kicker: 'Paso 4', title: 'Inversor, protecciones y conexión a la red.', body: 'Legalización ante el operador de red y certificación RETIE acompañan la puesta en marcha.' },
  { at: 0.665, step: 4, kicker: 'Paso 5', title: 'Amanece y la planta empieza a generar.', body: 'Ahorro real, medible, que nace de una conversación que tú abriste.' },
  { at: 0.855, step: 4, kicker: 'Paso 5', title: 'Una conexión puede convertirse en energía.', body: 'Refiere una empresa. GEENERA evalúa la oportunidad y tú sigues su avance en Aliados del Sol.' }
];
const STEPS = ['Identifica una empresa.', 'Comparte sus datos.', 'Incluye consumo y factura si los tienes.', 'GEENERA evalúa la oportunidad.', 'Sigue su avance en Aliados del Sol.'];
const ROWS = 4, COLS = 8, POSTS = 9;
const KWP = 187, KWH = 24500;
const fmt = (n) => Math.round(n).toLocaleString('es-CO');

class Component extends DCLogic {
  reduced = typeof window !== 'undefined' && !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  small = typeof window !== 'undefined' && window.innerWidth < 720;
  tick = () => {
    let el = this.root && document.contains(this.root) ? this.root : null;
    if (!el && this.stage && document.contains(this.stage)) el = this.root = this.stage.parentElement;
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.bottom < -200 || r.top > window.innerHeight + 200) return;
    const off = Number(this.props.headerOffset ?? 72);
    const span = Math.max(1, r.height - (window.innerHeight - off));
    const p = this.reduced ? 1 : Math.max(0, Math.min(1, (off - r.top) / span));
    if (p !== this._p) { this._p = p; this.paint(p); }
  };
  ensure() { if (!this._poll) this._poll = setInterval(this.tick, 32); }
  componentDidMount() {
    /* En pantallas angostas el readout no cabe en la esquina (choca con la CTA y el
       rail de pasos): se centra sobre el arreglo. */
    if (this.small && this.meter) this.set(this.meter, { right: 'auto', left: '50%', bottom: '30%', minWidth: '0' });
    this.ensure(); this.tick();
  }
  componentWillUnmount() { clearInterval(this._poll); this._poll = null; }
  seg(p, a, b) { return Math.max(0, Math.min(1, (p - a) / (b - a))); }
  set(el, o) {
    if (!el) return;
    const c = el.__v || (el.__v = {});
    for (const k in o) { if (c[k] !== o[k]) { c[k] = o[k]; el.style[k] = o[k]; } }
  }
  txt(el, t) { if (el && el.textContent !== t) el.textContent = t; }
  paint(p) {
    const S = (a, b) => this.seg(p, a, b), set = (el, o) => this.set(el, o);
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const roof = ease(S(0.00, 0.045)), chips = S(0.09, 0.14), chipsOut = S(0.19, 0.22);
    const build = S(0.30, 0.50), bos = ease(S(0.50, 0.58)), sun = ease(S(0.60, 0.78));
    const gen = S(0.64, 0.82), cta = S(0.84, 0.91), camera = ease(S(0.02, 0.90));

    /* Cámara: vuelo rasante que se levanta y abre plano mientras la planta crece */
    set(this.plane, { transform: 'translateY(-50%) rotateX(' + (70 - 26 * camera).toFixed(1) + 'deg) rotateZ(' + (-9 + 9 * camera).toFixed(2) + 'deg) scale(' + (1.2 - 0.34 * camera).toFixed(3) + ')' });
    set(this.world, { transform: 'translate3d(-50%,' + (54 - 92 * camera).toFixed(0) + 'px,0)' });
    set(this.roof, { opacity: roof.toFixed(2), transform: 'translate3d(0,' + (70 - 70 * roof).toFixed(0) + 'px,0)' });
    set(this.shadow, { opacity: (roof * 0.85 * (1 - 0.4 * sun)).toFixed(2) });
    set(this.company, { opacity: (S(0.008, 0.04) * (1 - S(0.06, 0.085))).toFixed(2), transform: 'translate3d(-50%,' + (14 - 14 * S(0.008, 0.04)).toFixed(0) + 'px,0)' });

    set(this.chipsEl, { opacity: (chips * (1 - chipsOut)).toFixed(2) });
    let lit = 0;
    (this.chipEls || []).forEach((el, i) => {
      const on = S(0.09 + i * 0.011, 0.103 + i * 0.011) > 0.5; if (on) lit++;
      set(el, { color: on ? '#FFCA05' : 'var(--mut3,#7C7873)', borderColor: on ? 'rgba(255,202,5,.45)' : 'var(--w-10,rgba(255,255,255,.1))', background: on ? 'rgba(255,202,5,.09)' : 'var(--w-03,rgba(255,255,255,.03))', transform: on ? 'translateY(-2px)' : 'none' });
    });
    set(this.quality, { width: (lit / 5 * 100).toFixed(0) + '%' });
    this.txt(this.qualityLabel, lit >= 5 ? 'Referido Perfecto · máxima calidad' : (lit > 0 ? 'Calidad del referido · ' + lit + ' de 5 datos' : 'Calidad del referido'));

    (this.railEls || []).forEach((pair, i) => {
      const t = ease(S(0.19 + i * 0.016, 0.245 + i * 0.016));
      set(pair[0], { opacity: t.toFixed(2), transform: 'translate3d(' + (-50 + 50 * t).toFixed(0) + 'px,0,0)' });
      set(pair[1], { opacity: t.toFixed(2), transform: 'translate3d(' + (50 - 50 * t).toFixed(0) + 'px,0,0)' });
    });
    (this.postEls || []).forEach((el, i) => {
      const a = 0.195 + (i % POSTS) * 0.004 + Math.floor(i / POSTS) * 0.016;
      const t = ease(S(a, a + 0.022));
      set(el, { opacity: t.toFixed(2), transform: 'scaleY(' + t.toFixed(2) + ')' });
    });

    /* Montaje en ola diagonal: fila a fila, columna a columna */
    const total = ROWS + COLS;
    let placed = 0;
    (this.panelEls || []).forEach((el, i) => {
      const row = Math.floor(i / COLS), col = i % COLS;
      const t = ease(Math.max(0, Math.min(1, (build - (row + col) / total * 0.8) * 5.5)));
      if (t > 0.9) placed++;
      set(el, {
        opacity: t.toFixed(2),
        transform: 'translate3d(0,' + (-90 + 90 * t).toFixed(0) + 'px,' + (80 - 80 * t).toFixed(0) + 'px) rotateX(' + (-22 + 22 * t).toFixed(1) + 'deg)',
        boxShadow: '0 ' + (14 - 9 * sun).toFixed(0) + 'px ' + (26 - 14 * sun).toFixed(0) + 'px -12px rgba(0,0,0,' + (0.85 - 0.25 * sun).toFixed(2) + ')' + (sun > 0.35 ? ',0 0 26px rgba(255,202,5,' + (0.16 * sun).toFixed(2) + ')' : '')
      });
    });
    /* Reflejo especular: barrido de luz que cruza el arreglo a medida que el sol sube */
    (this.sheenEls || []).forEach((el, i) => {
      const row = Math.floor(i / COLS), col = i % COLS;
      const d = (col * 0.055 + row * 0.03);
      const t = Math.max(0, Math.min(1, (sun - d * 0.35) * 1.5));
      set(el, { opacity: (t * 0.9).toFixed(2), transform: 'translate3d(' + (-70 + 90 * t).toFixed(0) + '%,0,0)' });
    });
    (this.glassEls || []).forEach((el) => set(el, { opacity: (0.85 + 0.35 * sun).toFixed(2) }));

    set(this.bos, { opacity: bos.toFixed(2), transform: 'translate3d(' + (-24 + 24 * bos).toFixed(0) + 'px,0,0)' });
    set(this.conduit, { opacity: bos.toFixed(2) });
    set(this.led, { opacity: bos > 0.7 ? '1' : '0' });

    set(this.sky, { opacity: (sun * 0.9).toFixed(2) });
    /* El sol entra alto por la esquina superior derecha y baja apenas: nunca sale desde abajo. */
    /* Amanecer: el sol asoma tras el arreglo y SUBE hacia el cielo, a la derecha del texto.
       Y va de -22 % a -56 % de su propio alto para que el disco quede sobre el horizonte. */
    set(this.sun, { opacity: (sun * 0.95).toFixed(2), transform: 'translate3d(' + (20 - 20 * sun).toFixed(1) + '%,' + (-22 - 34 * sun).toFixed(1) + '%,0) scale(' + (0.78 + 0.38 * sun).toFixed(3) + ')' });
    set(this.ray, { opacity: (sun * 0.85).toFixed(2) });

    set(this.meter, { opacity: gen.toFixed(2), transform: this.small ? 'translate3d(-50%,' + (12 - 12 * gen).toFixed(0) + 'px,0)' : 'translate3d(' + (18 - 18 * gen).toFixed(0) + 'px,0,0)' });
    this.txt(this.kwp, fmt(KWP * gen));
    set(this.genBar, { width: (gen * 100).toFixed(0) + '%' });
    this.txt(this.kwh, fmt(KWH * gen) + ' kWh/mes · demo');

    set(this.cta, { opacity: cta.toFixed(2), transform: 'translate3d(-50%,' + (16 - 16 * cta).toFixed(0) + 'px,0)', pointerEvents: cta > 0.6 ? 'auto' : 'none' });

    let active = 0;
    SCENES.forEach((s, i) => { if (p >= s.at - 0.012) active = i; });
    (this.capEls || []).forEach((el, i) => {
      const on = i === active;
      set(el, { opacity: on ? '1' : '0', transform: 'translate3d(0,' + (on ? 0 : 14) + 'px,0)', transition: 'opacity 420ms ease, transform 520ms cubic-bezier(.22,.61,.36,1)' });
    });
    const stepIdx = SCENES[active].step;
    (this.stepEls || []).forEach((pair, i) => {
      const on = i <= stepIdx, now = i === stepIdx;
      set(pair[0], { color: now ? 'var(--fg,#F2F0EC)' : (on ? 'var(--t2,#C9C5BE)' : 'var(--t3,#B4B0A9)'), opacity: now ? '1' : (on ? '.78' : '.62') });
      set(pair[1], { background: on ? '#FFCA05' : 'var(--w-12,rgba(255,255,255,.12))', boxShadow: now ? '0 0 10px rgba(255,202,5,.6)' : 'none' });
    });
  }
  renderVals() {
    this.ensure();
    this._p = null;
    this.chipEls = []; this.panelEls = []; this.sheenEls = []; this.glassEls = []; this.capEls = []; this.stepEls = []; this.railEls = []; this.postEls = [];
    const rails = [];
    for (let r = 0; r < ROWS; r++) {
      const panels = [], posts = [];
      for (let c = 0; c < COLS; c++) {
        const i = r * COLS + c;
        panels.push({ ref: (el) => { this.panelEls[i] = el; }, sheen: (el) => { this.sheenEls[i] = el; }, glass: (el) => { this.glassEls[i] = el; } });
      }
      for (let k = 0; k < POSTS; k++) { const i = r * POSTS + k; posts.push({ ref: (el) => { this.postEls[i] = el; } }); }
      this.railEls[r] = [null, null];
      rails.push({ panels, posts, railA: (el) => { this.railEls[r][0] = el; }, railB: (el) => { this.railEls[r][1] = el; } });
    }
    return {
      headerOffset: Number(this.props.headerOffset ?? 72),
      trackHeight: this.reduced ? 'calc(100vh + 20px)' : (this.small ? '215vh' : '260vh'),
      rootRef: (el) => { this.root = el; }, stageRef: (el) => { this.stage = el; },
      skyRef: (el) => { this.sky = el; }, sunRef: (el) => { this.sun = el; }, rayRef: (el) => { this.ray = el; },
      worldRef: (el) => { this.world = el; }, planeRef: (el) => { this.plane = el; }, roofRef: (el) => { this.roof = el; }, shadowRef: (el) => { this.shadow = el; },
      bosRef: (el) => { this.bos = el; }, conduitRef: (el) => { this.conduit = el; }, ledRef: (el) => { this.led = el; },
      meterRef: (el) => { this.meter = el; }, kwpRef: (el) => { this.kwp = el; }, kwhRef: (el) => { this.kwh = el; }, genBarRef: (el) => { this.genBar = el; },
      companyRef: (el) => { this.company = el; }, chipsRef: (el) => { this.chipsEl = el; },
      qualityRef: (el) => { this.quality = el; }, qualityLabelRef: (el) => { this.qualityLabel = el; },
      ctaRef: (el) => { this.cta = el; }, railRef: (el) => { this.rail = el; },
      rails,
      pulses: [{ delay: '0s' }, { delay: '.5s' }, { delay: '1s' }],
      chips: ['Empresa', 'Contacto', 'Ubicación', 'Consumo', 'Factura'].map((label, i) => ({ label, ref: (el) => { this.chipEls[i] = el; } })),
      captions: SCENES.map((s, i) => ({ kicker: s.kicker, step: STEPS[s.step], title: s.title, body: s.body, ref: (el) => { this.capEls[i] = el; } })),
      steps: STEPS.map((t, i) => { this.stepEls[i] = [null, null]; return { n: String(i + 1), t, ref: (el) => { this.stepEls[i][0] = el; }, dot: (el) => { this.stepEls[i][1] = el; } }; }),
      onRefer: this.props.onRefer || (() => {})
    };
  }
}

</script>
</body>
